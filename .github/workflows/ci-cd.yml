name: Food Ordering CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  test:
    name: Test and Security Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - restaurant-service
          - menu-service
          - order-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

      - name: Run npm security audit
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high

  build:
    name: Build Versioned Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create version artifact
        run: |
          echo "Application version: ${{ steps.version.outputs.version }}" > build-version.txt
          echo "Commit: $GITHUB_SHA" >> build-version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-ordering-version-${{ steps.version.outputs.version }}
          path: build-version.txt

      - name: Build restaurant image
        run: docker build -t food-restaurant:${{ steps.version.outputs.version }} ./restaurant-service

      - name: Build menu image
        run: docker build -t food-menu:${{ steps.version.outputs.version }} ./menu-service

      - name: Build order image
        run: docker build -t food-order:${{ steps.version.outputs.version }} ./order-service

      - name: Build frontend image
        run: docker build -t food-frontend:${{ steps.version.outputs.version }} ./frontend

      - name: Scan restaurant image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: food-restaurant:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan menu image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: food-menu:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan order image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: food-order:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: food-frontend:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy:
    name: Kubernetes Deployment
    needs: build
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/

      - name: Update versioned images
        run: |
          VERSION=$(cat VERSION)
          kubectl set image deployment/restaurant-service restaurant-service=food-restaurant:${VERSION}
          kubectl set image deployment/menu-service menu-service=food-menu:${VERSION}
          kubectl set image deployment/order-service order-service=food-order:${VERSION}
          kubectl set image deployment/food-frontend food-frontend=food-frontend:${VERSION}

      - name: Check deployment status
        run: |
          kubectl rollout status deployment/restaurant-service
          kubectl rollout status deployment/menu-service
          kubectl rollout status deployment/order-service
          kubectl rollout status deployment/food-frontend
