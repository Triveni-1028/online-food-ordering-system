apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-frontend
  template:
    metadata:
      labels:
        app: food-frontend
    spec:
      containers:
      - name: food-frontend
        image: food-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: food-frontend
  ports:
  - port: 80
    targetPort: 8004
  type: NodePort
